modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Blightcaller/issues"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Curse ticks: hurt sound and red flash per player (client option)
[[mixins]]
config="${mod_id}.mixins.json"

# Only applied when Pufferfish's Skills is installed (see mixin.skills.SkillsMixinPlugin)
[[mixins]]
config="${mod_id}.skills.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Blightcaller"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Spell Engine pulls in Cloth Config and playerAnimator as its own required dependencies
    modId="spell_engine"
    type="required"
    versionRange="${spell_engine_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Soul school and spell power attributes (comes with Spell Engine)
    modId="spell_power"
    type="required"
    versionRange="${spell_power_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Runes: the spells cost a soul rune (runes:soul_stone); without Runes they cannot be cast
    modId="runes"
    type="required"
    versionRange="${runes_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Robe model of tier 1 to 3 with glow mask (client/BlightcallerArmorRenderers)
    modId="armor_model_api"
    type="required"
    versionRange="${armor_model_api_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: curse level and every curse with its remaining time in the Jade tooltip (compat/jade, only with Jade)
    modId="jade"
    type="optional"
    versionRange="${jade_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the Blightcaller skill tab, or its branch in the Class Skills tab (compat/skilltree, only with Skill Tree)
    modId="skill_tree_rpgs"
    type="optional"
    versionRange="${skill_tree_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: the skill tab runs on Pufferfish's Skills (comes with Skill Tree)
    modId="puffish_skills"
    type="optional"
    versionRange="${puffish_skills_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: rings, amulets and relics (compat/curios); without Curios these items are not registered
    modId="curios"
    type="optional"
    versionRange="${curios_version_range}"
    ordering="AFTER"
    side="BOTH"
